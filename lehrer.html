<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lehrerauswertung – Sparta</title><style>body{font-family:Arial;background:#111827;margin:0;color:#172033}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:15px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{padding:10px;border-radius:8px;border:1px solid #bbb}button{background:#92400e;color:#fff;border:0;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{background:#f3f4f6}.bad{color:#991b1b}.good{color:#166534}@media(max-width:700px){.tablewrap{overflow:auto}}</style></head><body><div class='wrap'><div class='card'><h1>Lehrerauswertung – Escape Room Sparta</h1><div id='login'><p>Mit deinem Supabase-Lehrerkonto anmelden.</p><div class='row'><input id='email' type='email' placeholder='E-Mail'><input id='password' type='password' placeholder='Passwort'><button onclick='loginTeacher()'>Anmelden</button></div><p id='msg'></p></div><div id='panel' style='display:none'><div class='row'><button onclick='loadResults()'>Aktualisieren</button><button onclick='exportCSV()'>CSV exportieren</button><button onclick='logoutTeacher()'>Abmelden</button></div><p id='count'></p><div class='tablewrap'><table><thead><tr><th>Zeit</th><th>Name</th><th>Klasse/Kurs</th><th>Punkte</th><th>Bonus</th><th>Gesamt</th><th>MSS</th><th>Note</th><th>0-Punkte</th></tr></thead><tbody id='rows'></tbody></table></div></div></div></div><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='config.js'></script><script>const sb=window.supabase.createClient(ER_CONFIG.supabaseUrl,ER_CONFIG.supabaseKey);let current=[];async function loginTeacher(){msg.textContent='Anmeldung …';let {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.innerHTML='<span class="bad">'+error.message+'</span>';return}showPanel()}async function showPanel(){login.style.display='none';panel.style.display='block';await loadResults()}async function loadResults(){let {data,error}=await sb.from('results').select('id,created_at,student_name,class_name,score,bonus,total,mss_points,grade_text,zero_count').order('created_at',{ascending:false});if(error){count.innerHTML='<span class="bad">'+error.message+'</span>';return}current=data||[];count.textContent=current.length+' Ergebnisse';rows.innerHTML=current.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('de-DE')}</td><td>${esc(r.student_name)}</td><td>${esc(r.class_name)}</td><td>${r.score}/100</td><td>${r.bonus}/4</td><td>${r.total}/104</td><td>${r.mss_points}</td><td>${esc(r.grade_text)}</td><td>${r.zero_count}</td></tr>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function exportCSV(){let h=['Zeit','Name','Klasse/Kurs','Punkte','Bonus','Gesamt','MSS','Note','0-Punkte'];let lines=[h,...current.map(r=>[new Date(r.created_at).toLocaleString('de-DE'),r.student_name,r.class_name,r.score,r.bonus,r.total,r.mss_points,r.grade_text,r.zero_count])].map(a=>a.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\n');let b=new Blob(['\ufeff'+lines],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='sparta-ergebnisse.csv';a.click();URL.revokeObjectURL(u)}async function logoutTeacher(){await sb.auth.signOut();location.reload()}sb.auth.getSession().then(({data})=>{if(data.session)showPanel()});</script></body></html>
